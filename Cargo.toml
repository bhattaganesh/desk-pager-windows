[package]
name = "desk-pager"
version = "0.2.0"
edition = "2021"
description = "Windows tray app that buzzes your phone after 45 minutes of continuous sitting"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
# 0.13 defaults: rustls + Windows certificate store verifier + system proxy.
reqwest = "=0.13.5"
serde = { version = "1", features = ["derive"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
getrandom = "0.4"
windows-registry = "=0.100.0"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
